<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- COVER PAGE -->
    <div class="cover" id="cover">

        <div class="envelope">💌</div>

        <h1>You're Invited!</h1>

        <p>to a special birthday celebration</p>

        <button onclick="openInvitation()">
            Open Invitation
        </button>

    </div>


    <!-- INVITATION PAGE -->
    <div class="invitation-page" id="invitationPage">

        <div class="top-bar">

            <button class="back-button" onclick="goBack()">
                ← Back
            </button>

            <h2>Birthday Invitation</h2>

        </div>


        <!-- PDF PAGES WILL APPEAR HERE -->
        <div id="pdf-container"></div>

    </div>


    <!-- PDF.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        function openInvitation() {

            document.getElementById("cover").style.display = "none";

            document.getElementById("invitationPage").style.display = "block";

            loadPDF();

        }


        function goBack() {

            document.getElementById("invitationPage").style.display = "none";

            document.getElementById("cover").style.display = "flex";

        }


        async function loadPDF() {

            const container = document.getElementById("pdf-container");

            // Prevent loading the PDF more than once
            if (container.children.length > 0) {
                return;
            }

            try {

                const pdf = await pdfjsLib.getDocument("invitation.pdf").promise;


                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

                    const page = await pdf.getPage(pageNumber);


                    // Create canvas
                    const canvas = document.createElement("canvas");

                    canvas.className = "pdf-page";


                    const context = canvas.getContext("2d");


                    // Original PDF size
                    const viewport = page.getViewport({
                        scale: 1
                    });


                    // Make the PDF fit the screen
                    const containerWidth = container.clientWidth;

                    const scale = containerWidth / viewport.width;


                    const scaledViewport = page.getViewport({
                        scale: scale
                    });


                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;


                    container.appendChild(canvas);


                    // Render page
                    await page.render({
                        canvasContext: context,
                        viewport: scaledViewport
                    }).promise;

                }

            } catch (error) {

                container.innerHTML =
                    "<p class='error'>Unable to load the invitation.</p>";

                console.error(error);

            }

        }

    </script>

</body>
</html>
